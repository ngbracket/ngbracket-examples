<h2 class="page-title">Orders</h2>

<div class="toolbar">
  <input
    #filter
    class="filter"
    type="search"
    placeholder="Filter by customer"
    [value]="query()"
    (input)="setQuery(filter.value)"
  />
  <select #sortSelect class="sort" [value]="sort()" (change)="setSort(sortSelect.value)">
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
    <option value="total">Highest total</option>
  </select>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="select">
          <input type="checkbox" [checked]="allSelected()" (change)="toggleAll()" />
        </th>
        <th>Order</th>
        <th>Customer</th>
        <th>Date</th>
        <th class="num">Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      @for (order of rows(); track order.id) {
        <tr>
          <td class="select">
            <input type="checkbox" [checked]="selected().has(order.id)" (change)="toggle(order.id)" />
          </td>
          <td>#{{ order.id }}</td>
          <td>{{ order.customer }}</td>
          <td class="muted">{{ order.date | date: 'd MMM' }}</td>
          <td class="num">{{ order.total | currency: 'GBP' }}</td>
          <td>
            <span class="badge" [class]="'badge-' + order.status.toLowerCase()">
              {{ order.status }}
            </span>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="empty">No orders match "{{ query() }}".</td>
        </tr>
      }
    </tbody>
  </table>
</div>
