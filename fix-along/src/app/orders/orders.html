<h1 class="page-title">Orders</h1>

<div class="toolbar">
  <div class="field filter-field">
    <label for="order-filter">Filter by customer</label>
    <input
      #filter
      id="order-filter"
      class="filter"
      type="search"
      [value]="query()"
      (input)="setQuery(filter.value)"
    />
  </div>
  <div class="field">
    <label for="order-sort">Sort</label>
    <select
      #sortSelect
      id="order-sort"
      class="sort"
      [value]="sort()"
      (change)="setSort(sortSelect.value)"
    >
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="total">Highest total</option>
    </select>
  </div>
</div>

<div class="table-wrap">
  <table aria-label="Orders">
    <thead>
      <tr>
        <th class="select">
          <input
            type="checkbox"
            aria-label="Select all orders"
            [checked]="allSelected()"
            (change)="toggleAll()"
          />
        </th>
        <th>Order</th>
        <th>Customer</th>
        <th>Date</th>
        <th class="num">Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      @for (order of rows(); track order.id) {
        <tr>
          <td class="select">
            <input
              type="checkbox"
              [attr.aria-label]="'Select order ' + order.id"
              [checked]="selected().has(order.id)"
              (change)="toggle(order.id)"
            />
          </td>
          <td>#{{ order.id }}</td>
          <td>{{ order.customer }}</td>
          <td class="muted">{{ order.date | date: 'd MMM' }}</td>
          <td class="num">{{ order.total | currency: 'GBP' }}</td>
          <td>
            <span class="badge" [class]="'badge-' + order.status.toLowerCase()">
              {{ order.status }}
            </span>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="empty">No orders match "{{ query() }}".</td>
        </tr>
      }
    </tbody>
  </table>
</div>
