<ul class="nav">
  <li>
    <a
      class="nav-item"
      routerLink="/orders"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <app-icon name="orders" />
      Orders
    </a>
  </li>
  <li>
    <a
      class="nav-item"
      routerLink="/customers"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
    >
      <app-icon name="customers" />
      Customers
    </a>
  </li>
  <li>
    <button
      type="button"
      class="nav-item"
      [attr.aria-expanded]="reportsOpen()"
      (click)="toggleReports()"
    >
      <app-icon name="reports" />
      Reports
      <app-icon name="chevron" class="chevron" [class.open]="reportsOpen()" />
    </button>
    @if (reportsOpen()) {
      <ul class="submenu">
        @for (report of reports; track report.slug) {
          <li>
            <a
              class="sub-item"
              [routerLink]="['/reports', report.slug]"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
            >
              {{ report.label }}
            </a>
          </li>
        }
      </ul>
    }
  </li>
</ul>
